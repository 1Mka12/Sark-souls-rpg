
name: Build Dark Lands RPG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Встановити Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Налаштувати Android SDK
        uses: android-actions/setup-android@v3

      - name: Встановити компоненти Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Завантажити Godot 4.4.1
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"

          curl -fL --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip

          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

          mv Godot_v4.4.1-stable_linux.x86_64 godot

      - name: Завантажити шаблони експорту
        run: |
          cd "$RUNNER_TEMP/godot"

          curl -fL --retry 3 \
            -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz

          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp "$RUNNER_TEMP/godot-templates/templates/"* \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          echo "4.4.1.stable" \
            > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"

      - name: Налаштувати Godot для Android
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Перевірити проєкт Godot
        run: |
          godot --version
          godot --headless --editor --path . --quit

      - name: Зібрати Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . \
            --export-debug "Android" \
            build/android/DarkLandsRPG.apk

          test -s build/android/DarkLandsRPG.apk

      - name: Зберегти APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Lands-RPG-Android
          path: build/android/DarkLandsRPG.apk
          if-no-files-found: error
          retention-days: 7
          
